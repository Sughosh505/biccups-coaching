name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    env:
      # The build only needs these to be present. Every Supabase call is made per
      # request at runtime, so placeholders never reach a real project — and no
      # real key is needed to prove the app compiles.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Build first: it generates next-env.d.ts and .next/types, both of which
      # tsconfig.json includes and neither of which is committed.
      - run: npm run build

      - run: npm run typecheck

      - run: npm run lint

  security-gate:
    name: Security gate (needs a live Supabase project)
    # Manual only. The audit creates and deletes probe accounts against a real
    # project, so it is not something to fire on every push to a shared database.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run audit-security.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_URL is not configured — security gate skipped."
            exit 0
          fi
          # The gate scripts read .env.local rather than the environment.
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
          } > .env.local
          node scripts/audit-security.mjs

      - name: Remove credentials
        if: always()
        run: rm -f .env.local
